[project]
name = "python-react-web-api"
version = "0.1.0"
description = "FastAPI backend for the monorepo skeleton"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic",
  "fastapi",
  "psycopg[binary]",
  "pydantic-settings",
  "python-socks[asyncio]",
  "sqlalchemy",
  "uvicorn[standard]",
  "websockets"
]

[dependency-groups]
dev = [
  "httpx",
  "pytest",
  "pytest-cov",
  "ruff"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
