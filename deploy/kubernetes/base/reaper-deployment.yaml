apiVersion: apps/v1
kind: Deployment
metadata:
  name: werewolf-live-run-reaper
  namespace: werewolf
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: werewolf-live-run-reaper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: werewolf-live-run-reaper
        app.kubernetes.io/part-of: werewolf-arena
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: reaper
          image: werewolf-api:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.cli", "run-live-run-reaper"]
          envFrom:
            - configMapRef:
                name: werewolf-api-config
            - secretRef:
                name: werewolf-api-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            exec:
              command: ["python", "-m", "app.cli", "check-live-run-reaper"]
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["python", "-m", "app.cli", "check-live-run-reaper"]
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["python", "-m", "app.cli", "check-live-run-reaper"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2

