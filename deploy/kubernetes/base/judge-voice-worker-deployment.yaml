apiVersion: apps/v1
kind: Deployment
metadata:
  name: werewolf-judge-voice-worker
  namespace: werewolf
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: werewolf-judge-voice-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: werewolf-judge-voice-worker
        app.kubernetes.io/part-of: werewolf-arena
    spec:
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: judge-voice-worker
          image: werewolf-api:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.cli", "run-judge-voice-worker"]
          envFrom:
            - configMapRef:
                name: werewolf-api-config
            - secretRef:
                name: werewolf-api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            exec:
              command: ["python", "-m", "app.cli", "check-judge-voice-worker"]
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["python", "-m", "app.cli", "check-judge-voice-worker"]
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["python", "-m", "app.cli", "check-judge-voice-worker"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
