apiVersion: apps/v1
kind: Deployment
metadata:
  name: werewolf-admin-web
  namespace: werewolf
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: werewolf-admin-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: werewolf-admin-web
        app.kubernetes.io/part-of: werewolf-arena
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: admin-web
          image: werewolf-admin-web:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: API_UPSTREAM
              value: http://werewolf-api:8000
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
