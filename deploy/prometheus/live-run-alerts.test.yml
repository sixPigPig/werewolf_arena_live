rule_files:
  - live-run-alerts.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: werewolf_rule_snapshot_failures_total{reason="content_hash_mismatch"}
        values: 0 1 1 1 1 1 1 1
      - series: werewolf_rule_checkpoint_failures_total{reason="content_hash_mismatch"}
        values: 0 1 1 1 1 1 1 1
    alert_rule_test:
      - eval_time: 7m
        alertname: WerewolfRuleSnapshotFailures
        exp_alerts: []
      - eval_time: 7m
        alertname: WerewolfRuleCheckpointFailures
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: werewolf_rule_snapshot_failures_total{reason="content_hash_mismatch"}
        values: 0 1 2 3 4 5 6 7
      - series: werewolf_rule_checkpoint_failures_total{reason="content_hash_mismatch"}
        values: 0 1 2 3 4 5 6 7
    alert_rule_test:
      - eval_time: 7m
        alertname: WerewolfRuleSnapshotFailures
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Rule snapshot failures are sustained
              description: One or more API Pods have continued to report bounded rule snapshot parse or hash failures.
      - eval_time: 7m
        alertname: WerewolfRuleCheckpointFailures
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Rule checkpoint failures are sustained
              description: One or more API Pods have continued to report bounded checkpoint validation or restore failures.
